name: Cobhan-Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published] # Trigger when release is created

jobs:
  test-linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: 'true'
    - name: Test Cobhan
      run: scripts/test.sh
  test-macos:
    timeout-minutes: 15
    runs-on: 'macos-latest'
    strategy:
      matrix:
        go-version: [stable, oldstable]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: 'true'
    - name: Test Cobhan
      run: scripts/test.sh
