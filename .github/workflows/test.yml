name: Cobhan-Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published] # Trigger when release is created

jobs:
  test-linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        check-latest: 'true'
    - name: Test Cobhan
      run: scripts/test.sh
  test-macos:
    timeout-minutes: 15
    runs-on: 'macos-latest'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        check-latest: 'true'
    - name: Test Cobhan
      run: scripts/test.sh
